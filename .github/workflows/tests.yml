name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bridge/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # e2e_bridge.py drives its own tmux server (tmux -L orrery-e2e-*)
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Python dependencies
        run: python -m pip install -r bridge/requirements.txt pytest

      - name: bridge tests
        working-directory: bridge
        run: python -m pytest -q -rs tests

      - name: tools tests
        run: python -m pytest -q -rs tools

      - name: descriptor quality (node)
        run: node tools/descriptor_quality_js_test.js
